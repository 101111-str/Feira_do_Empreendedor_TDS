<title>Ferry Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
  :root{
    --ink:#101815; --ink-2:#414e4a; --ink-3:#6b7874;
    --paper:#f1f4f2; --surface:#ffffff; --surface-2:#e9eeeb; --surface-3:#dfe6e2;
    --line:#d6ddd9; --line-strong:#b9c4bf;
    --accent:#14614a; --accent-soft:#e2efe9; --accent-ink:#ffffff;
    --crit:#a3301d; --crit-soft:#f8e7e3;
    --warn:#8d6206; --warn-soft:#f7eeda;
    --ok:#2f7d54; --ok-soft:#e4f1e9;
    --info:#3b4c8a; --info-soft:#e6e9f4;
    --fA:#3b4c8a; --fB:#8d6206; --fC:#14614a; --fD:#9b4a2f;
    --display:"Archivo","Helvetica Neue",Arial,sans-serif;
    --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --r:6px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e7ece9; --ink-2:#aab7b2; --ink-3:#7e8c87;
      --paper:#0c1211; --surface:#141c1a; --surface-2:#1b2521; --surface-3:#243029;
      --line:#283430; --line-strong:#3a4642;
      --accent:#5cc79e; --accent-soft:#14302a; --accent-ink:#06211a;
      --crit:#e8856e; --crit-soft:#33201c;
      --warn:#d8a94c; --warn-soft:#2f2617;
      --ok:#6dc294; --ok-soft:#162b21;
      --info:#8fa3dc; --info-soft:#1b2136;
      --fA:#8fa3dc; --fB:#d8a94c; --fC:#5cc79e; --fD:#d9876a;
    }
  }
  :root[data-theme="dark"]{
    --ink:#e7ece9; --ink-2:#aab7b2; --ink-3:#7e8c87;
    --paper:#0c1211; --surface:#141c1a; --surface-2:#1b2521; --surface-3:#243029;
    --line:#283430; --line-strong:#3a4642;
    --accent:#5cc79e; --accent-soft:#14302a; --accent-ink:#06211a;
    --crit:#e8856e; --crit-soft:#33201c;
    --warn:#d8a94c; --warn-soft:#2f2617;
    --ok:#6dc294; --ok-soft:#162b21;
    --info:#8fa3dc; --info-soft:#1b2136;
    --fA:#8fa3dc; --fB:#d8a94c; --fC:#5cc79e; --fD:#d9876a;
  }

  *{box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:var(--display); margin:0; text-wrap:balance;}
  p{margin:0;}
  button,input,select,textarea{font:inherit; color:inherit;}
  a{color:var(--accent);}

  /* ---------- chrome ---------- */
  .top{position:sticky; top:0; z-index:40; background:var(--surface); border-bottom:1px solid var(--line);}
  .topin{max-width:1180px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:14px;}
  .brand{display:flex; align-items:baseline; gap:9px; margin-right:auto; min-width:0;}
  .brand b{font-family:var(--display); font-size:18px; font-weight:700; letter-spacing:-.02em; white-space:nowrap;}
  .brand span{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap;}
  .status{font-family:var(--mono); font-size:10.5px; padding:3px 8px; border-radius:99px; border:1px solid var(--line-strong); color:var(--ink-3); white-space:nowrap;}
  .status.on{color:var(--ok); border-color:var(--ok); background:var(--ok-soft);}
  .status.local{color:var(--warn); border-color:var(--warn); background:var(--warn-soft);}

  nav.tabs{background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:53px; z-index:39; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  nav.tabs .tabsin{max-width:1180px; margin:0 auto; padding:0 10px; display:flex; gap:2px; min-width:max-content;}
  nav.tabs a{display:block; padding:11px 13px; font-size:13.5px; font-weight:500; color:var(--ink-2); text-decoration:none; border-bottom:2px solid transparent; white-space:nowrap;}
  nav.tabs a:hover{color:var(--ink);}
  nav.tabs a.sel{color:var(--accent); border-bottom-color:var(--accent); font-weight:600;}

  main{max-width:1180px; margin:0 auto; padding:22px 16px 90px;}
  .head{display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap; margin-bottom:18px;}
  .head h2{font-size:24px; font-weight:600; letter-spacing:-.015em;}
  .head p{color:var(--ink-2); font-size:14px; margin-top:3px; max-width:66ch;}
  .head .sp{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap;}

  /* ---------- controls ---------- */
  .btn{display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:var(--r); border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-size:13.5px; font-weight:500; cursor:pointer;}
  .btn:hover{background:var(--surface-2);}
  .btn.pri{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600;}
  .btn.pri:hover{filter:brightness(1.08);}
  .btn.sm{padding:5px 10px; font-size:12.5px;}
  .btn.danger{color:var(--crit); border-color:var(--crit);}
  .btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}

  label.f{display:block; margin-bottom:10px;}
  label.f > span{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); margin-bottom:4px;}
  input[type=text],input[type=date],input[type=number],select,textarea{width:100%; padding:8px 10px; border:1px solid var(--line-strong); border-radius:var(--r); background:var(--surface); font-size:14px;}
  textarea{min-height:64px; resize:vertical;}
  .row{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:0 14px;}

  /* ---------- surfaces ---------- */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px 17px;}
  .grid{display:grid; gap:14px;}
  .g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr));}
  .g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
  .sec{margin-top:26px;}
  .sec > h3{font-size:16px; font-weight:600; margin-bottom:12px; display:flex; align-items:baseline; gap:9px;}
  .sec > h3 em{font-style:normal; font-family:var(--mono); font-size:11px; color:var(--ink-3); font-weight:500;}

  .kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px;}
  .kpi .k{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);}
  .kpi .v{font-family:var(--display); font-size:30px; font-weight:700; line-height:1.1; margin-top:5px; font-variant-numeric:tabular-nums;}
  .kpi .s{font-size:12.5px; color:var(--ink-3); margin-top:2px;}
  .kpi.alert{border-color:var(--crit); background:var(--crit-soft);} .kpi.alert .v{color:var(--crit);}
  .kpi.warn{border-color:var(--warn); background:var(--warn-soft);} .kpi.warn .v{color:var(--warn);}
  .kpi.good .v{color:var(--ok);}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .tw{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface);}
  th,td{text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  thead th{font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); background:var(--surface-2); font-weight:600; white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  td.num{font-family:var(--mono); font-variant-numeric:tabular-nums;}
  .muted{color:var(--ink-3);}

  .pill{display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; padding:3px 7px; border-radius:99px; border:1px solid currentColor; white-space:nowrap;}
  .p-pendente{color:var(--ink-3);} .p-andamento{color:var(--info); background:var(--info-soft);}
  .p-revisao{color:var(--warn); background:var(--warn-soft);} .p-concluida{color:var(--ok); background:var(--ok-soft);}
  .p-bloqueada{color:var(--crit); background:var(--crit-soft);}
  .tag{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:2px 8px; border-radius:99px; color:#fff; white-space:nowrap;}

  .bar{height:7px; border-radius:99px; background:var(--surface-3); overflow:hidden;}
  .bar > i{display:block; height:100%; background:var(--accent);}

  .empty{padding:30px 18px; text-align:center; color:var(--ink-3); border:1px dashed var(--line-strong); border-radius:var(--r); font-size:14px;}
  .feed{display:flex; flex-direction:column; gap:0;}
  .fe{display:flex; gap:11px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px; align-items:baseline;}
  .fe:last-child{border-bottom:none;}
  .fe time{font-family:var(--mono); font-size:11px; color:var(--ink-3); flex:none; min-width:86px;}

  dialog{border:1px solid var(--line-strong); border-radius:10px; background:var(--surface); color:var(--ink); padding:0; max-width:560px; width:calc(100% - 28px);}
  dialog::backdrop{background:rgba(6,14,11,.5);}
  dialog .dh{padding:15px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px;}
  dialog .dh h3{font-size:17px; font-weight:600; margin-right:auto;}
  dialog .db{padding:17px 18px; max-height:64vh; overflow:auto;}
  dialog .df{padding:13px 18px; border-top:1px solid var(--line); display:flex; gap:9px; justify-content:flex-end;}

  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:22px; z-index:90; background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:99px; font-size:13.5px; font-weight:500; box-shadow:0 6px 24px rgba(0,0,0,.25);}

  .scan{width:100%; max-width:340px; aspect-ratio:1; background:#000; border-radius:var(--r); object-fit:cover; display:block; margin:0 auto;}
  .qrbox{background:#fff; padding:10px; border-radius:var(--r); display:inline-block; line-height:0;}
  .qrbox svg{width:150px; height:150px;}
  .qrgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px;}
  .qcard{text-align:center; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px;}
  .qcard .cd{font-family:var(--mono); font-size:13px; font-weight:600; margin-top:9px;}
  .qcard .lb{font-size:12px; color:var(--ink-3);}

  .stars{display:flex; gap:7px; flex-wrap:wrap;}
  .stars button{width:44px; height:44px; border-radius:var(--r); border:1px solid var(--line-strong); background:var(--surface); font-family:var(--mono); font-weight:600; cursor:pointer;}
  .stars button[aria-pressed=true]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  .pub{background:var(--ink); color:var(--paper); min-height:100vh; padding:26px;}
  .pub h1{font-size:clamp(26px,4vw,44px); font-weight:700; letter-spacing:-.02em;}
  .pub .pg{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-top:24px;}
  .pub .pc{border:1px solid rgba(255,255,255,.16); border-radius:10px; padding:18px;}
  .pub .pc .k{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; opacity:.62;}
  .pub .pc .v{font-family:var(--display); font-size:44px; font-weight:700; line-height:1.05; font-variant-numeric:tabular-nums;}

  @media (max-width:560px){
    .brand span{display:none;}
    .status{font-size:9.5px; padding:2px 6px;}
    .head h2{font-size:20px;}
    .kpi .v{font-size:25px;}
    nav.tabs{top:49px;}
    .topin{padding:8px 14px;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important;}}
</style>

<div class="top"><div class="topin">
  <div class="brand"><b>Ferry Ops</b><span id="ctx">Mercado João Ferry 2026</span></div>
  <span class="status" id="st">iniciando…</span>
</div></div>

<nav class="tabs"><div class="tabsin" id="tabs"></div></nav>

<main id="app"><div class="empty">Carregando…</div></main>

<dialog id="dlg"></dialog>

<script src="qr.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
